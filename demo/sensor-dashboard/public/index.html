<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Sensor Dashboard</h1>
    <p class="subtitle">Live readings from the building</p>
  </header>

  <main>
    <!-- TODO (issue #3): humidity chart goes here  -->

    <section id="alerts-panel">
      <h2>Alerts</h2>
      <form id="alert-form">
        <select id="alert-sensor" required>
          <option value="office-1">office-1</option>
          <option value="office-2">office-2</option>
          <option value="lobby">lobby</option>
        </select>
        <select id="alert-type" required>
          <option value="temperature">temperature</option>
          <option value="humidity">humidity</option>
        </select>
        <select id="alert-op" required>
          <option value=">">&gt;</option>
          <option value="<">&lt;</option>
        </select>
        <input id="alert-threshold" type="number" step="any" placeholder="threshold" required>
        <button type="submit">Add rule</button>
      </form>
      <ul id="alert-list"></ul>
    </section>

    <section id="empty-state">
      <p>No charts yet. Agents — over to you.</p>
    </section>

    <section id="temperature-card" class="card" hidden>
      <h2>Temperature</h2>
      <canvas id="temperature-chart"></canvas>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
